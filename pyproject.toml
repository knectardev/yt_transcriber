[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baroque-transcribe"
version = "0.1.0"
description = "Transcribe solo piano recordings to unquantized MIDI and notation-ready MusicXML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "audioread>=3.0",
    "scipy>=1.11",
    "soundfile>=0.12",
    "matplotlib>=3.8",
    "mido>=1.3",
    "pretty_midi>=0.2.10",
    "music21>=9.1",
    "yt-dlp>=2024.8.6",
    "librosa>=0.10.1",
    "torchlibrosa>=0.1.0",
    "piano-transcription-inference==0.0.6",
]

[project.optional-dependencies]
ui = ["streamlit>=1.33", "pandas>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
baroque-transcribe = "baroque_transcribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
