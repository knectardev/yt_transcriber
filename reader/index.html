<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <title>Performance reader</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/reader.css" />
  </head>
  <body>
    <header id="app-header">
      <div class="header-main">
        <a href="./" id="btn-catalog" class="catalog-link" hidden>← Catalog</a>
        <h1 id="piece-title">Performance reader</h1>
        <div class="meta" id="section-label" hidden></div>
        <div class="meta" id="system-label">Bach keyboard catalog</div>
      </div>
    </header>

    <div id="error-banner" hidden></div>

    <main id="view-catalog">
      <p id="catalog-empty" hidden></p>
      <ul id="catalog-list"></ul>
    </main>

    <section id="view-score" aria-label="Score">
      <div id="score-toolbar">
        <button type="button" id="btn-prev-section" hidden>Previous section</button>
        <button type="button" id="btn-next-section" hidden>Next section</button>
        <label id="section-picker-wrap" hidden>
          Section
          <select id="section-picker"></select>
        </label>
        <button type="button" id="btn-prev">Previous system</button>
        <button type="button" id="btn-next">Next system</button>
        <label id="color-toggle" hidden>
          <input type="checkbox" id="color-voices" />
          Color voices
        </label>
        <label class="setup-only">
          Zoom
          <input id="zoom" type="range" min="0.5" max="1.6" step="0.05" value="1" />
        </label>
        <label class="setup-only">
          Overlap
          <input id="overlap" type="range" min="0" max="0.4" step="0.05" value="0.15" />
        </label>
        <button type="button" id="btn-performance" class="setup-only">Performance</button>
      </div>
      <div id="score-pane">
        <div id="score"><p class="osmd-loading">Loading score…</p></div>
      </div>
    </section>

    <script src="vendor/opensheetmusicdisplay.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
